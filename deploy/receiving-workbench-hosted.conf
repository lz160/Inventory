[Unit]
Requires=receiving-sql.service
After=receiving-sql.service
ConditionPathIsMountPoint=/srv/receiving-sql

[Service]
WorkingDirectory=/opt/receiving-workbench-sql
Environment=IMS_PERSISTENCE=hosted-sql
EnvironmentFile=/srv/receiving-sql/app.env
ExecStart=
ExecStart=/usr/bin/node /opt/receiving-workbench-sql/node_modules/tsx/dist/cli.mjs /opt/receiving-workbench-sql/server.ts
ReadWritePaths=
